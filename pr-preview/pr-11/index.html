    <script>
      // Apply the saved theme before the first paint, so the page never flashes the wrong colors.
      try {
        // Pull request previews use their own storage names (see src/storage.ts).
        var base = '/baduk-notebook/pr-preview/pr-11/'
        var key = 'baduk-notebook.settings' + (base === '/baduk-notebook/' || base === '/' ? '' : '@' + base)
        var s = JSON.parse(localStorage.getItem(key) || '{}')
        document.documentElement.dataset.style = s.theme || 'modern'
        document.documentElement.dataset.mode = s.colorMode || 'auto'
      } catch (e) {
        document.documentElement.dataset.style = 'modern'
        document.documentElement.dataset.mode = 'auto'
      }
    </script>
